name: NovaChrono baseline

on:
  pull_request:
  push:
    branches:
      - astra/critical-stabilisation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novachrono_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d novachrono_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Wait for isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: pg_isready -h 127.0.0.1 -p 5432 -U postgres -d novachrono_ci

      - name: Apply fresh migration chain
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/novachrono_ci
          DATABASE_DRIVER: pg
        run: npm run migrate

      - name: Rehearse production-shaped migration chain
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE novachrono_production_shape'
          production_shape_url='postgresql://postgres:postgres@127.0.0.1:5432/novachrono_production_shape'
          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0001_initial.sql
          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0002_add_unique_league_slots.sql
          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -1 -f tests/fixtures/gate2-production-shape.sql
          for migration in migrations/0003_*.sql migrations/0004_*.sql migrations/0005_*.sql migrations/0006_*.sql; do
            psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -c "ALTER TABLE match_events ALTER COLUMN type DROP NOT NULL"
          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -c "INSERT INTO match_events (match_id, type) VALUES ('70000000-0000-4000-8000-000000000001', 'start_first_half')"
          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0007_match_goal_idempotency.sql
          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -c "SELECT operation_id FROM match_events WHERE match_id = '70000000-0000-4000-8000-000000000001'"
          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -c "INSERT INTO match_events (match_id, type) VALUES ('70000000-0000-4000-8000-000000000001', NULL)"
          if psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -c "INSERT INTO match_events (match_id, type, operation_id) VALUES ('70000000-0000-4000-8000-000000000001', NULL, '90000000-0000-4000-8000-000000000090')"; then
            echo "NULL event type unexpectedly accepted an operation ID"
            exit 1
          fi
          if psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -c "INSERT INTO match_events (match_id, type, operation_id) VALUES ('70000000-0000-4000-8000-000000000001', 'end_match', '90000000-0000-4000-8000-000000000091')"; then
            echo "Non-goal event unexpectedly accepted an operation ID"
            exit 1
          fi
          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -c "INSERT INTO match_events (match_id, type, operation_id) VALUES ('70000000-0000-4000-8000-000000000001', 'goal_home', '90000000-0000-4000-8000-000000000092')"
          if psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -c "INSERT INTO match_events (match_id, type, operation_id) VALUES ('70000000-0000-4000-8000-000000000001', 'goal_home', '90000000-0000-4000-8000-000000000092')"; then
            echo "Duplicate match-scoped operation ID unexpectedly succeeded"
            exit 1
          fi
          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0008_gate4a_league_operations.sql

          test "$(psql "$production_shape_url" -X -At -v ON_ERROR_STOP=1 -c "SELECT column_default FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'leagues' AND column_name = 'status'")" = "'active'::text"
          test "$(psql "$production_shape_url" -X -At -v ON_ERROR_STOP=1 -c "SELECT string_agg(confdeltype::text, ',' ORDER BY conname) FROM pg_constraint WHERE conrelid = 'matches'::regclass AND conname IN ('matches_home_team_id_fkey', 'matches_away_team_id_fkey')")" = "n,n"
          test "$(psql "$production_shape_url" -X -At -v ON_ERROR_STOP=1 -c "SELECT string_agg(is_nullable, ',' ORDER BY column_name) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'matches' AND column_name IN ('home_score', 'away_score')")" = "YES,YES"

          createdb -h 127.0.0.1 -U postgres -T novachrono_production_shape novachrono_gate4b_ambiguous
          createdb -h 127.0.0.1 -U postgres -T novachrono_production_shape novachrono_gate4b_missing
          createdb -h 127.0.0.1 -U postgres -T novachrono_production_shape novachrono_gate4b_duplicate

          ambiguous_url='postgresql://postgres:postgres@127.0.0.1:5432/novachrono_gate4b_ambiguous'
          psql "$ambiguous_url" -X -v ON_ERROR_STOP=1 -c "INSERT INTO teams (id, league_id, slot_id, name, status) VALUES ('60000000-0000-4000-8000-000000000010', '40000000-0000-4000-8000-000000000001', '50000000-0000-4000-8000-000000000001', 'Ambiguous Historical Team', 'inactive')"
          if psql "$ambiguous_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0009_gate4b_league_lifecycle.sql; then
            echo "Gate 4B unexpectedly accepted ambiguous historical identity"
            exit 1
          fi

          missing_url='postgresql://postgres:postgres@127.0.0.1:5432/novachrono_gate4b_missing'
          psql "$missing_url" -X -v ON_ERROR_STOP=1 -c "INSERT INTO league_slots (id, league_id, slot_number) VALUES ('50000000-0000-4000-8000-000000000004', '40000000-0000-4000-8000-000000000001', 4); UPDATE matches SET home_slot_id = '50000000-0000-4000-8000-000000000004' WHERE id = '70000000-0000-4000-8000-000000000001'"
          if psql "$missing_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0009_gate4b_league_lifecycle.sql; then
            echo "Gate 4B unexpectedly accepted a match slot without a team"
            exit 1
          fi

          duplicate_url='postgresql://postgres:postgres@127.0.0.1:5432/novachrono_gate4b_duplicate'
          psql "$duplicate_url" -X -v ON_ERROR_STOP=1 -c "UPDATE teams SET status = 'active' WHERE id = '60000000-0000-4000-8000-000000000003'"
          if psql "$duplicate_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0009_gate4b_league_lifecycle.sql; then
            echo "Gate 4B unexpectedly accepted duplicate active slot occupants"
            exit 1
          fi

          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0009_gate4b_league_lifecycle.sql
          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -c "SELECT result_type, nova_planned_date(match_date) FROM matches WHERE id = '70000000-0000-4000-8000-000000000001'"
          # The route integration suites run once, after the final migration: the
          # application authenticates against auth_users.account_status (0011).

          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -1 -f tests/fixtures/gate5-production-facts.sql
          createdb -h 127.0.0.1 -U postgres -T novachrono_production_shape novachrono_gate5_bad_notification
          createdb -h 127.0.0.1 -U postgres -T novachrono_production_shape novachrono_gate5_duplicate_push
          createdb -h 127.0.0.1 -U postgres -T novachrono_production_shape novachrono_gate5_bad_response
          createdb -h 127.0.0.1 -U postgres -T novachrono_production_shape novachrono_gate5_bad_state
          createdb -h 127.0.0.1 -U postgres -T novachrono_production_shape novachrono_gate5_duplicate_identity

          bad_notification_url='postgresql://postgres:postgres@127.0.0.1:5432/novachrono_gate5_bad_notification'
          psql "$bad_notification_url" -X -v ON_ERROR_STOP=1 -c "INSERT INTO notifications (user_id, type, title, message) VALUES ('30000000-0000-4000-8000-000000000002', 'unsupported_type', 'Bad', 'Bad')"
          if psql "$bad_notification_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0010_gate5_availability_notifications.sql; then
            echo "Gate 5 unexpectedly accepted an unsupported notification type"
            exit 1
          fi

          duplicate_push_url='postgresql://postgres:postgres@127.0.0.1:5432/novachrono_gate5_duplicate_push'
          psql "$duplicate_push_url" -X -v ON_ERROR_STOP=1 -c "UPDATE auth_users SET push_token = 'ExpoPushToken[duplicate]' WHERE id IN ('30000000-0000-4000-8000-000000000001', '30000000-0000-4000-8000-000000000002')"
          if psql "$duplicate_push_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0010_gate5_availability_notifications.sql; then
            echo "Gate 5 unexpectedly accepted duplicate push-token ownership"
            exit 1
          fi

          bad_response_url='postgresql://postgres:postgres@127.0.0.1:5432/novachrono_gate5_bad_response'
          psql "$bad_response_url" -X -v ON_ERROR_STOP=1 -c "INSERT INTO availability_responses (match_id, team_id, token, response, responded_at) VALUES ('70000000-0000-4000-8000-000000000001', '60000000-0000-4000-8000-000000000001', NULL, 'maybe', CURRENT_TIMESTAMP)"
          if psql "$bad_response_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0010_gate5_availability_notifications.sql; then
            echo "Gate 5 unexpectedly accepted an invalid availability response"
            exit 1
          fi

          bad_state_url='postgresql://postgres:postgres@127.0.0.1:5432/novachrono_gate5_bad_state'
          psql "$bad_state_url" -X -v ON_ERROR_STOP=1 -c "INSERT INTO availability_responses (match_id, team_id, token, response, responded_at) VALUES ('70000000-0000-4000-8000-000000000001', '60000000-0000-4000-8000-000000000001', repeat('a', 64), 'yes', CURRENT_TIMESTAMP)"
          if psql "$bad_state_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0010_gate5_availability_notifications.sql; then
            echo "Gate 5 unexpectedly accepted inconsistent availability state"
            exit 1
          fi

          duplicate_identity_url='postgresql://postgres:postgres@127.0.0.1:5432/novachrono_gate5_duplicate_identity'
          psql "$duplicate_identity_url" -X -v ON_ERROR_STOP=1 -c "ALTER TABLE availability_responses DROP CONSTRAINT availability_responses_match_team_key; INSERT INTO availability_responses (match_id, team_id, token) VALUES ('70000000-0000-4000-8000-000000000001', '60000000-0000-4000-8000-000000000001', repeat('a', 64)), ('70000000-0000-4000-8000-000000000001', '60000000-0000-4000-8000-000000000001', repeat('b', 64))"
          if psql "$duplicate_identity_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0010_gate5_availability_notifications.sql; then
            echo "Gate 5 unexpectedly accepted duplicate availability identity"
            exit 1
          fi

          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0010_gate5_availability_notifications.sql
          test "$(psql "$production_shape_url" -X -At -v ON_ERROR_STOP=1 -c "SELECT string_agg(column_name, ',' ORDER BY column_name) FROM information_schema.columns WHERE table_schema = 'public' AND ((table_name = 'availability_responses' AND column_name IN ('expires_at', 'delivery_claim_id', 'delivery_claimed_at')) OR (table_name = 'notifications' AND column_name IN ('dedupe_key', 'read_at')))")" = "dedupe_key,delivery_claim_id,delivery_claimed_at,expires_at,read_at"
          test "$(psql "$production_shape_url" -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_constraint WHERE conname IN ('availability_responses_response_supported', 'availability_responses_state_consistent', 'availability_responses_token_format', 'availability_responses_claim_consistent', 'notifications_type_supported') AND convalidated")" = "5"
          test "$(psql "$production_shape_url" -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_class WHERE relname IN ('availability_responses_token_unique', 'notifications_dedupe_key_unique', 'auth_users_push_token_unique')")" = "3"

          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (id serial PRIMARY KEY, name text NOT NULL UNIQUE, applied_at timestamptz NOT NULL DEFAULT NOW()); INSERT INTO schema_migrations (name) SELECT format('%s_recorded.sql', generate_series) FROM generate_series(1, 9); INSERT INTO schema_migrations (name) VALUES ('0010_gate5_availability_notifications.sql')"
          createdb -h 127.0.0.1 -U postgres -T novachrono_production_shape novachrono_gate6a_missing_0010
          createdb -h 127.0.0.1 -U postgres -T novachrono_production_shape novachrono_gate6a_reserved_email
          createdb -h 127.0.0.1 -U postgres -T novachrono_production_shape novachrono_gate6a_duplicate_email

          missing_0010_url='postgresql://postgres:postgres@127.0.0.1:5432/novachrono_gate6a_missing_0010'
          psql "$missing_0010_url" -X -v ON_ERROR_STOP=1 -c "DELETE FROM schema_migrations WHERE name = '0010_gate5_availability_notifications.sql'"
          if psql "$missing_0010_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0011_gate6a_account_lifecycle.sql; then
            echo "Gate 6A unexpectedly accepted a database without recorded migration 0010"
            exit 1
          fi

          reserved_email_url='postgresql://postgres:postgres@127.0.0.1:5432/novachrono_gate6a_reserved_email'
          psql "$reserved_email_url" -X -v ON_ERROR_STOP=1 -c "UPDATE auth_users SET email = 'occupied@account.invalid' WHERE id = (SELECT id FROM auth_users ORDER BY id LIMIT 1)"
          if psql "$reserved_email_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0011_gate6a_account_lifecycle.sql; then
            echo "Gate 6A unexpectedly accepted prior use of the reserved lifecycle domain"
            exit 1
          fi

          duplicate_email_url='postgresql://postgres:postgres@127.0.0.1:5432/novachrono_gate6a_duplicate_email'
          psql "$duplicate_email_url" -X -v ON_ERROR_STOP=1 -c "DROP INDEX auth_users_email_lower_unique; WITH ranked AS (SELECT id, row_number() OVER (ORDER BY id) AS n FROM auth_users) UPDATE auth_users u SET email = CASE ranked.n WHEN 1 THEN 'Duplicate@Example.test' WHEN 2 THEN 'duplicate@example.test' ELSE u.email END FROM ranked WHERE u.id = ranked.id AND ranked.n IN (1,2)"
          if psql "$duplicate_email_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0011_gate6a_account_lifecycle.sql; then
            echo "Gate 6A unexpectedly accepted canonical email duplicates"
            exit 1
          fi

          psql "$production_shape_url" -X -v ON_ERROR_STOP=1 -1 -f migrations/0011_gate6a_account_lifecycle.sql
          test "$(psql "$production_shape_url" -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_constraint WHERE conname IN ('auth_users_account_status_supported', 'auth_users_lifecycle_state_consistent', 'auth_users_lifecycle_email_consistent') AND convalidated")" = "3"
          test "$(psql "$production_shape_url" -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_class WHERE relname IN ('auth_users_deletion_request_unique', 'auth_users_active_role_idx')")" = "2"

          # Route and concurrency suites run against the final production-shaped
          # schema because every authenticated request reads auth_users.account_status.
          createdb -h 127.0.0.1 -U postgres -T novachrono_production_shape novachrono_gate2_routes
          TEST_DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/novachrono_gate2_routes' npx vitest run --config vitest.integration.config.js tests/integration/gate2-remediation-routes.test.js
          TEST_DATABASE_URL="$production_shape_url" npx vitest run --config vitest.integration.config.js tests/integration/gate5-communications.test.js
          TEST_DATABASE_URL="$production_shape_url" npx vitest run --config vitest.integration.config.js tests/integration/gate6a-account-lifecycle.test.js

      - name: Unit and contract tests
        run: npm test

      - name: PostgreSQL route and concurrency tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/novachrono_ci
        run: npm run test:integration

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-not-used-outside-this-job
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/novachrono_ci
          DATABASE_DRIVER: pg
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed isolated browser database
        env:
          PGPASSWORD: postgres
        run: psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d novachrono_ci -f tests/fixtures/gate2-playwright-users.sql

      - name: Browser smoke
        run: npm run test:e2e
        env:
          PLAYWRIGHT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/novachrono_ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Reject committed secret files and private keys
        shell: bash
        run: |
          unexpected_env=$(git ls-files '.env*' ':!:*.example')
          if [ -n "$unexpected_env" ]; then
            echo "Unexpected committed environment file(s):"
            echo "$unexpected_env"
            exit 1
          fi
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'; then
            echo "Private key material found in tracked files."
            exit 1
          fi
